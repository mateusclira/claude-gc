version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - errorlint
    - misspell
    - nolintlint
    - unconvert
  settings:
    errcheck:
      # Output to stdout/stderr: a failed write (closed pipe) is not something
      # a CLI can do anything about.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

formatters:
  enable:
    - gofmt
    - goimports
